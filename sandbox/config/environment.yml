name: ideias-brutas-sandbox
description: "Sandbox environment for ideias-brutas project"

environment:
  type: sandbox
  version: "2w3-0"
  
database:
  host: sandbox-db
  port: 5432
  name: sandbox
  user: sandbox_user
  password: sandbox_pass

cache:
  host: sandbox-redis
  port: 6379
  
logging:
  level: debug
  output: /app/logs/sandbox.log

features:
  supply_chain: true
  playbook_execution: true
  machine_management: true