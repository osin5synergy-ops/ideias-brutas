name: "Agent Cronos"

# Workflow que registra mudanças na documentação como NF-Atos®
on:
  push:
    branches:
      - main
      - master
    paths:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**.md"
      - ".github/workflows/**.yml"

jobs:
  registrar-nf-ato:
    name: "Registrar NF-Ato® no Log Soberano"
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      issues: write
    
    steps:
      - name: "📥 Checkout do Código"
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: "📝 Extrair Informações da Mudança"
        id: info
        run: |
          echo "🕐 Agent Cronos ativado..."
          
          # Informações do commit
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          COMMIT_DATE=$(git log -1 --pretty=%ci)
          
          # Arquivos modificados
          FILES=$(git diff --name-only HEAD^ HEAD | grep -E '\.(md|yml|yaml)$' || echo "")
          FILES_COUNT=$(echo "$FILES" | grep -v '^$' | wc -l)
          
          # Tipos de mudanças
          if echo "$FILES" | grep -q "ISSUE_TEMPLATE"; then
            TIPO="📋 Issue Template"
          elif echo "$FILES" | grep -q "workflows"; then
            TIPO="⚙️ Workflow"
          elif echo "$FILES" | grep -q "README"; then
            TIPO="📖 README"
          else
            TIPO="📄 Documentação"
          fi
          
          # Salvar outputs
          echo "commit_sha=${COMMIT_SHA:0:7}" >> $GITHUB_OUTPUT
          echo "commit_msg<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "commit_author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
          echo "commit_date=$COMMIT_DATE" >> $GITHUB_OUTPUT
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "files_count=$FILES_COUNT" >> $GITHUB_OUTPUT
          echo "tipo=$TIPO" >> $GITHUB_OUTPUT
          
          echo "✅ Informações extraídas:"
          echo "  - SHA: ${COMMIT_SHA:0:7}"
          echo "  - Autor: $COMMIT_AUTHOR"
          echo "  - Arquivos: $FILES_COUNT"
          echo "  - Tipo: $TIPO"
      
      - name: "🔍 Procurar Issue Log Soberano (#69)"
        id: find_log
        uses: actions/github-script@v7
        with:
          script: |
            // Procurar issue #69 ou issue com label 'log-soberano'
            let logIssue = null;
            
            try {
              // Tentar issue #69 primeiro
              const issue69 = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 69
              });
              
              if (issue69.data && issue69.data.title.includes('Log Soberano')) {
                logIssue = 69;
              }
            } catch (error) {
              console.log('Issue #69 não encontrada, procurando por label...');
            }
            
            if (!logIssue) {
              // Procurar por label
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'log-soberano',
                state: 'open',
                per_page: 1
              });
              
              if (issues.data.length > 0) {
                logIssue = issues.data[0].number;
              }
            }
            
            core.setOutput('log_issue', logIssue || 'none');
            return logIssue;
      
      - name: "📋 Adicionar NF-Ato® ao Log"
        if: steps.find_log.outputs.log_issue != 'none'
        uses: actions/github-script@v7
        with:
          script: |
            const logIssue = ${{ steps.find_log.outputs.log_issue }};
            const tipo = `${{ steps.info.outputs.tipo }}`;
            const commitSha = `${{ steps.info.outputs.commit_sha }}`;
            const commitMsg = `${{ steps.info.outputs.commit_msg }}`;
            const commitAuthor = `${{ steps.info.outputs.commit_author }}`;
            const commitDate = `${{ steps.info.outputs.commit_date }}`;
            const files = `${{ steps.info.outputs.files }}`;
            const filesCount = `${{ steps.info.outputs.files_count }}`;
            
            const filesList = files.split('\n').filter(f => f.trim()).map(f => `  - \`${f}\``).join('\n');
            
            const nfAto = `## 🕐 NF-Ato® - ${tipo}
            
            **Data:** ${commitDate}  
            **Autor:** @${commitAuthor}  
            **Commit:** [\`${commitSha}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${{ github.sha }})
            
            ### 📝 Descrição
            ${commitMsg}
            
            ### 📄 Arquivos Alterados (${filesCount})
            ${filesList}
            
            ### 🔗 Referências
            - Workflow Run: [#${{ github.run_number }}](${{ github.server_url }}/${context.repo.owner}/${context.repo.repo}/actions/runs/${{ github.run_id }})
            - Branch: \`${{ github.ref_name }}\`
            
            ---
            _Registrado automaticamente pelo Agent Cronos_
            `;
            
            await github.rest.issues.createComment({
              issue_number: logIssue,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: nfAto
            });
            
            console.log(`✅ NF-Ato® registrado na issue #${logIssue}`);
      
      - name: "⚠️ Log Soberano não encontrado"
        if: steps.find_log.outputs.log_issue == 'none'
        run: |
          echo "⚠️ Log Soberano (issue #69 ou com label 'log-soberano') não encontrado."
          echo "📋 Para ativar o Agent Cronos:"
          echo "  1. Crie uma issue com título 'Log Soberano' e número #69, OU"
          echo "  2. Crie uma issue com label 'log-soberano'"
          echo ""
          echo "ℹ️ Este não é um erro - o workflow continuará funcionando."
          echo "   NF-Atos® serão registrados assim que o Log for criado."
