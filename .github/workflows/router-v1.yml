name: Agent Roteador v1.0 - Sinergie Mainframe®

# Trigger: Aciona quando uma nova Issue é aberta
on:
  issues:
    types: [opened]

# Permissões necessárias para modificar issues
permissions:
  issues: write
  contents: read

jobs:
  triagem-automatica:
    name: Triagem Automática de Issues
    runs-on: ubuntu-latest
    
    steps:
      - name: Aplicar Label de Triagem
        uses: actions/github-script@v7
        with:
          script: |
            // Agent Roteador - MVP v1.0
            // Objetivo: Aplicar automaticamente a label 'status:em-triagem' em novas Issues
            
            const issueNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            console.log(`🔄 Iniciando triagem da Issue #${issueNumber}`);
            
            try {
              // Aplicar a label 'status:em-triagem'
              await github.rest.issues.addLabels({
                owner: owner,
                repo: repo,
                issue_number: issueNumber,
                labels: ['status:em-triagem']
              });
              
              console.log(`✅ Label 'status:em-triagem' aplicada com sucesso à Issue #${issueNumber}`);
              
              // Adicionar comentário de boas-vindas explicando o processo
              await github.rest.issues.createComment({
                owner: owner,
                repo: repo,
                issue_number: issueNumber,
                body: `## 🤖 Agent Roteador - Sinergie Mainframe®
                
**Status:** Esta Issue foi automaticamente marcada para triagem.

**Próximos Passos:**
1. ⏳ **Triagem Manual**: Um membro da equipe revisará e aplicará as tags apropriadas
2. 🏷️ **Classificação**: Consulte \`[KDA-TAGS]\` para ver nossa taxonomia oficial
3. 📋 **Síntese**: Após tagueamento, o Agent de Síntese gerará o Dossiê de Inteligência

**Nota:** Este é o MVP da Operação Gênese. Futuras iterações incluirão triagem automática via AI.

---
*Powered by Nação Soberana Synergies Web3®*`
              });
              
              console.log(`💬 Comentário de boas-vindas adicionado à Issue #${issueNumber}`);
              
            } catch (error) {
              console.error('❌ Erro na triagem:', error);
              core.setFailed(`Falha ao processar triagem: ${error.message}`);
            }
